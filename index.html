<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Player"><title>Pocket Player</title>
<style>
:root{--bg:#eef1f6;--fg:#0e1018;--mu:#6b7280;--cd:#ffffff;--ac:#6c5ce7;--ln:#00000014;--sh:#00000012;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0b10;--fg:#f4f5f8;--mu:#9aa0b0;--cd:#14161f;--ac:#a78bfa;--ln:#ffffff14;--sh:#00000060}}
:root[data-theme=light]{--bg:#eef1f6;--fg:#0e1018;--mu:#6b7280;--cd:#ffffff;--ac:#6c5ce7;--ln:#00000014;--sh:#00000012}
:root[data-theme=dark]{--bg:#0a0b10;--fg:#f4f5f8;--mu:#9aa0b0;--cd:#14161f;--ac:#a78bfa;--ln:#ffffff14;--sh:#00000060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
.pill{background:var(--ac);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600}
.pill.o{background:var(--cd);color:var(--fg)}
.lnk{color:var(--ac);font-weight:600}.dn{color:#e5484d!important}
.bar{padding:6px 16px}
#q{width:100%;padding:11px 14px;border-radius:12px;border:0;background:var(--cd);color:var(--fg);font-size:16px}
#tabs{display:flex;gap:6px;padding:4px 16px 10px}
#tabs button{flex:1;padding:9px 2px;font-size:14px;border-radius:10px;background:var(--cd);color:var(--mu);font-weight:600}
#tabs .on{background:var(--fg);color:var(--bg)}
.pad{padding:6px 16px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pad h2{width:100%;margin:0;font-size:24px}.mu{color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px}.row.on b{color:var(--ac)}
.row button{padding:8px;color:var(--mu)}.row .fv{color:var(--ac)}
.art{width:48px;height:48px;border-radius:9px;background:var(--cd);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--mu)}
.art img{width:100%;height:100%;object-fit:cover}
.t{flex:1;min-width:0}.t b,.t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span{color:var(--mu);font-size:14px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ic.f{fill:currentColor;stroke:none}
.empty{text-align:center;color:var(--mu);padding:40px 30px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--cd);border-radius:16px;box-shadow:0 8px 32px var(--sh, #0003);display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:4}
#mini button{padding:6px}
#full{position:fixed;inset:0;background:var(--bg);z-index:5;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateY(100%);transition:transform .3s;visibility:hidden}
#full.open{transform:none;visibility:visible}
.fh{display:flex;justify-content:space-between;align-items:center;color:var(--mu)}.fh button{padding:8px;color:var(--fg)}
.art.big{width:min(100%,340px);height:auto;aspect-ratio:1;margin:12px auto 18px;border-radius:20px}.art.big .ic{width:30%;height:30%}
.ti{display:flex;align-items:center;gap:10px}.ti div{flex:1;min-width:0}.ti h2{margin:0;font-size:22px}.ti p{margin:2px 0 0;color:var(--mu)}
#ffav{padding:8px}#ffav .ic{width:28px;height:28px}
#seek{width:100%;margin:14px 0 0;accent-color:var(--ac)}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.ctl{display:flex;justify-content:center;align-items:center;gap:28px;margin:10px 0 22px}
.ctl button{padding:8px;color:var(--fg);position:relative}.ctl .on{color:var(--ac)}
.ctl > button:not(.main) .ic{width:32px;height:32px}
.ctl .main{background:var(--fg);color:var(--bg);border-radius:50%;width:66px;height:66px;display:grid;place-items:center;padding:0}.main .ic{width:30px;height:30px}
.ctl.c2{justify-content:space-around;gap:0;margin-top:0}
.ctl.c2 button .ic{width:24px;height:24px}
#rp i{position:absolute;font-size:10px;font-style:normal;font-weight:700;top:50%;left:50%;transform:translate(-50%,-50%)}
.lyh{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln);padding-top:14px}
#lyr{white-space:pre-wrap;font:inherit;font-size:19px;line-height:1.7}
#ov{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;-webkit-overflow-scrolling:touch}
.m{width:100%;background:var(--cd);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.m h3{margin:0 0 8px}.m button{display:block;width:100%;text-align:left;padding:14px 4px;border-top:1px solid var(--ln)}
.m input,.m textarea{width:100%;margin:6px 0;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font:inherit}.m textarea{height:170px}

.hb{display:flex;align-items:center;gap:6px}.hb>button:not(.pill){padding:8px}
#tabs{overflow-x:auto}#tabs button{flex:none;padding:9px 14px;font-size:15px}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--tint,transparent),transparent 65%);background-attachment:fixed}
#full{overflow:hidden;padding:0;color:#fff;--fg:#fff;--mu:#ffffffb0;--ln:#ffffff33;background:linear-gradient(180deg,var(--dk,#20222b),#000)}
#fbg{position:absolute;left:0;right:0;top:0;height:78%;background-size:cover;background-position:center top;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent);filter:saturate(1.15)}
#fin{position:relative;height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
#fart{display:none}#scr{padding-top:min(52vw,230px)}
#full .ctl .main{background:#fff;color:#111}

#wheel{display:none}
#lyc{height:42vh;overflow-y:auto;position:relative;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent)}
#lyr{padding:14%  0}#lyr p{margin:0 0 14px;font-size:21px;font-weight:700;line-height:1.35;opacity:.5;transition:opacity .3s,color .3s}
#lyc.ns #lyr p{opacity:.92}#lyr p.on{opacity:1;color:var(--ac)}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#000c;color:#fff;padding:9px 16px;border-radius:99px;z-index:20;font-size:14px}
.m .row{padding:8px 0}.m .row button{width:auto;border:0;padding:8px}.m h4{margin:14px 0 4px;color:var(--mu)}
.big{margin:8px 0}.big b{display:block;font-size:22px}.big span{color:var(--mu)}.sr{display:flex;justify-content:space-between;padding:5px 0}.sr span{color:var(--mu)}

/* —— Sleek polish —— */
html[data-style=sleek] body{background-image:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent),linear-gradient(180deg,var(--tint,transparent),transparent 55%)}
html[data-style=sleek] #mini{backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);background:color-mix(in srgb,var(--cd) 88%,transparent)}
html[data-style=sleek] .pill{box-shadow:0 2px 8px color-mix(in srgb,var(--ac) 35%,transparent)}
html[data-style=sleek] .row{border-radius:12px;margin:2px 8px;padding:10px 12px}
html[data-style=sleek] .row.on{background:color-mix(in srgb,var(--ac) 12%,var(--cd))}
html[data-style=sleek] #tabs button{border-radius:12px}
html[data-style=sleek] #q{box-shadow:0 1px 3px var(--sh)}

/* —— iPod Classic (Y2K) —— */
html[data-style=ipod]{--bg:#c5c9d0;--fg:#111111;--mu:#4a5160;--cd:#f7f8fa;--ac:#2b6de5;--ln:#00000022;--sh:#00000028}
html[data-style=ipod][data-theme=dark]{--bg:#1a1c22;--fg:#e8eaef;--mu:#9aa0b0;--cd:#252830;--ac:#5b9aef;--ln:#ffffff18;--sh:#00000060}
@media(prefers-color-scheme:dark){
  html[data-style=ipod]:not([data-theme=light]){--bg:#1a1c22;--fg:#e8eaef;--mu:#9aa0b0;--cd:#252830;--ac:#5b9aef;--ln:#ffffff18;--sh:#00000060}
}
html[data-style=ipod] body{
  background:radial-gradient(ellipse at 50% 0%,#e8eaee 0%,#b8bdc6 55%,#9aa1ac 100%);
  font-family:Geneva,"Lucida Grande","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--fg)}
html[data-style=ipod][data-theme=dark] body{
  background:radial-gradient(ellipse at 50% 0%,#2a2e38 0%,#14161c 55%,#0c0e12 100%)}
@media(prefers-color-scheme:dark){
  html[data-style=ipod]:not([data-theme=light]) body{
    background:radial-gradient(ellipse at 50% 0%,#2a2e38 0%,#14161c 55%,#0c0e12 100%)}
}
html[data-style=ipod] header{
  background:linear-gradient(#ffffff,#d0d4db 45%,#b4bac4);
  border:1px solid #8a919c;border-radius:12px 12px 0 0;margin:8px 8px 0;padding:8px 12px;
  box-shadow:inset 0 1px 0 #fff,0 1px 2px #0002}
html[data-style=ipod] h1{font-size:15px;font-weight:700;letter-spacing:.02em;
  background:linear-gradient(#4a5160,#1a1e28);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-style=ipod] .pill,html[data-style=ipod] #tabs button{
  background:linear-gradient(#fff,#c8ced6);color:#1a1e28;border:1px solid #7a828e;
  box-shadow:inset 0 1px 0 #fff,0 1px 1px #0002;font-weight:700;border-radius:6px;font-size:12px;padding:6px 11px}
html[data-style=ipod] #tabs{padding:6px 10px;gap:4px;background:linear-gradient(#dfe2e7,#c5cad2);margin:0 8px;border-left:1px solid #8a919c;border-right:1px solid #8a919c}
html[data-style=ipod] #tabs .on,html[data-style=ipod] .row.on{
  background:linear-gradient(#5b9aef,#2b6de5 40%,#1a4fb8);color:#fff;
  box-shadow:inset 0 1px 0 #9bc4ff,0 1px 2px #0003;border-color:#1a4fb8}
html[data-style=ipod] .row.on b,html[data-style=ipod] .row.on span,html[data-style=ipod] .row.on button{color:#fff}
html[data-style=ipod] .bar{margin:0 8px;padding:6px 10px;background:#c5cad2;border-left:1px solid #8a919c;border-right:1px solid #8a919c}
html[data-style=ipod] #q{border:1px solid #7a828e;border-radius:4px;background:#fff;box-shadow:inset 0 1px 3px #0003;font-size:14px}
html[data-style=ipod] main{
  background:#fff;margin:0 8px 8px;border:1px solid #7a828e;border-top:0;border-radius:0 0 10px 10px;
  overflow:hidden;color:#111;box-shadow:0 4px 12px #0002;
  /* faux LCD screen inset */
  box-shadow:inset 0 0 0 3px #d8dce2,inset 0 0 0 4px #6a7180,0 4px 12px #0002}
html[data-style=ipod] .row{border-bottom:1px solid #e4e7ec;padding:7px 10px}
html[data-style=ipod] .art{border-radius:2px;width:40px;height:40px;border:1px solid #0002;background:#eef0f3}
html[data-style=ipod] .pad{background:linear-gradient(#f4f5f7,#dde1e6);border-bottom:1px solid #9aa1ab}
html[data-style=ipod] #mini{
  background:linear-gradient(#f8f9fb,#c5cad2);border:1px solid #7a828e;border-radius:14px;
  box-shadow:inset 0 1px 0 #fff,0 4px 16px #0003}
html[data-style=ipod] #full{--fg:#111;--mu:#4a5160;--ln:#0003;color:#111;
  background:linear-gradient(#d8dce3,#a8aeb8 40%,#8b929e)}
html[data-style=ipod] #fbg{display:none}
html[data-style=ipod] #scr{
  display:grid;grid-template-columns:84px 1fr;gap:4px 10px;padding:0 10px 10px;margin:8px;
  background:linear-gradient(#c8f0c8,#a8d8a8);border:3px solid #5a626e;border-radius:8px;
  box-shadow:inset 0 0 8px #0003,0 2px 4px #0002;overflow:hidden;color:#0a2a0a}
html[data-style=ipod] #scr::before{
  content:"Now Playing";grid-column:1/-1;margin:0 -10px 6px;padding:4px;text-align:center;
  font-weight:700;font-size:12px;letter-spacing:.04em;
  background:linear-gradient(#6a7380,#3a4250);color:#eef0f3;border-bottom:1px solid #2a3038;
  text-shadow:0 1px 0 #0006}
html[data-style=ipod] #fart{display:grid;width:84px;height:84px;margin:0;border-radius:2px;border:1px solid #0004}
html[data-style=ipod] .ti h2{font-size:15px;color:#0a2a0a}html[data-style=ipod] .ti p{color:#1a4a1a}
html[data-style=ipod] #seek,html[data-style=ipod] .tm{grid-column:1/-1}
html[data-style=ipod] #seek{accent-color:#1a4a1a}
html[data-style=ipod] .ctl:not(.c2){display:none}
html[data-style=ipod] #wheel{
  display:block;position:relative;width:260px;height:260px;margin:18px auto;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,#d8dce3 0 34%,transparent 35%),
    radial-gradient(circle at 32% 28%,#ffffff,#c5cad2 40%,#8b929e 75%,#6a7180);
  box-shadow:0 4px 12px #0004,inset 0 -4px 8px #0002,inset 0 3px 6px #fff8;
  border:1px solid #6a7180}
html[data-style=ipod] .wb{position:absolute;display:grid;place-items:center;color:#3a4250;font-weight:700;font-size:11px;letter-spacing:.06em;width:64px;height:44px;text-shadow:0 1px 0 #fff8}
html[data-style=ipod] .wb .ic{width:22px;height:22px}
html[data-style=ipod] .wb.t{top:10px;left:98px}.wb.b{bottom:10px;left:98px}.wb.l{left:8px;top:108px}.wb.r{right:8px;top:108px}
html[data-style=ipod] .wc{
  position:absolute;left:85px;top:85px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#b8bdc6 55%,#8b929e);
  box-shadow:inset 0 0 8px #0003,0 2px 4px #0003;border:1px solid #7a828e}
html[data-style=ipod] #lyc{color:#0a2a0a}
html[data-style=ipod] #full .ctl.c2 button{color:#2a3038}

html[data-style=ipod]:not([data-theme=light]) header{
  /* keep structure; colors via vars where possible */
}

/* One-handed full player: art up top, big controls bottom */

/* OLED pure black */

/* Spinning disc */
#fart.disc,#mart.disc{border-radius:50%!important;animation:spinDisc 8s linear infinite;animation-play-state:paused;box-shadow:0 0 0 3px #111,0 0 0 5px #666,0 8px 24px #0006}
#fart.disc.spinning,#mart.disc.spinning{animation-play-state:running}
#fart.disc::after,#mart.disc::after{content:'';position:absolute;left:50%;top:50%;width:14%;height:14%;transform:translate(-50%,-50%);border-radius:50%;background:#111;box-shadow:0 0 0 2px #444}
@keyframes spinDisc{to{transform:rotate(360deg)}}
.art{position:relative}
/* Album wear */
.art.wear1 img{filter:saturate(.92) contrast(1.02)}
.art.wear2 img{filter:saturate(.8) contrast(1.05) brightness(.97);box-shadow:inset 0 0 0 1px #0003}
.art.wear3 img{filter:saturate(.65) contrast(1.08) brightness(.93) sepia(.12);opacity:.95}
.art.wear3::before{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 12px #0005;pointer-events:none;
  background:linear-gradient(135deg,transparent 40%,#fff2 45%,transparent 50%),linear-gradient(40deg,#0002 0%,transparent 30%)}
/* Track change */
#ft,#fa,#fart{transition:opacity .25s,transform .35s}
.track-out #ft,.track-out #fa{opacity:0;transform:translateX(-12px)}
.track-out #fart{opacity:0;transform:scale(.92)}
/* A-Z strip */



/* Cover flow albums */
.flow{display:flex;gap:12px;overflow-x:auto;padding:16px 20px 24px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}

.flow .card .art{width:100%;height:auto;aspect-ratio:1;margin:0 auto 8px;border-radius:8px;transition:transform .25s}
.flow .card b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .card span{font-size:12px;color:var(--mu)}
/* Roulette */
@keyframes roulette{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}

async function coverForSession(s){
  if(!s||!s.cover)return[];
  const key=s.id+(s.cover.size||0);
  if(artCache[key])return artCache[key];
  try{
    const bmp=await createImageBitmap(s.cover);
    const size=Math.min(512,Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d');
    const scale=size/Math.max(bmp.width,bmp.height);
    const w=bmp.width*scale,h=bmp.height*scale;
    x.drawImage(bmp,(size-w)/2,(size-h)/2,w,h);
    const data=c.toDataURL('image/jpeg',0.85);
    const list=[{src:data,sizes:size+'x'+size,type:'image/jpeg'},{src:data,sizes:'256x256',type:'image/jpeg'},{src:data,sizes:'128x128',type:'image/jpeg'}];
    artCache[key]=list;return list;
  }catch(e){
    try{
      const buf=await s.cover.arrayBuffer();
      const b=new Uint8Array(buf);let bin='';const chunk=0x8000;
      for(let i=0;i<b.length;i+=chunk)bin+=String.fromCharCode.apply(null,b.subarray(i,i+chunk));
      const data='data:'+(s.cover.type||'image/jpeg')+';base64,'+btoa(bin);
      const list=[{src:data,sizes:'512x512',type:s.cover.type||'image/jpeg'}];
      artCache[key]=list;return list;
    }catch(e2){return[]}
  }

function pal(s){const r=document.documentElement.style;if(!s||!s.cover){['--ac','--tint','--dk'].forEach(k=>r.removeProperty(k));return}const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(im,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let R=0,G=0,B=0,W=0;for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),w=((mx-mn)/(mx||1))**2*(mx/255)+.01;R+=d[i]*w;G+=d[i+1]*w;B+=d[i+2]*w;W+=w}R/=W;G/=W;B/=W;const mx=Math.max(R,G,B),dl=mx-Math.min(R,G,B);let h=0;if(dl){h=mx==R?((G-B)/dl)%6:mx==G?(B-R)/dl+2:(R-G)/dl+4;h=Math.round(h*60);if(h<0)h+=360}const sa=Math.round(Math.max(.5,Math.min(.85,mx?dl/mx:0))*100),dk=matchMedia('(prefers-color-scheme:dark)').matches&&document.documentElement.dataset.theme!='light';r.setProperty('--ac',`hsl(${h} ${sa}% ${dk?68:46}%)`);r.setProperty('--tint',`hsl(${h} ${sa-10}% ${dk?16:86}%)`);r.setProperty('--dk',`hsl(${h} ${sa-25}% 15%)`)}catch(e){}};im.src=cv(s)}
let LY=[],LS=0,lyi=-1,lyT=0;
function lyParse(raw,duration){
  const lines=(raw||'').split(/\r?\n/).map(l=>l.trimEnd()).filter((l,i,a)=>l.length||(i&&a[i-1].length));
  const timed=[];
  let hasTime=0;
  for(const l of lines){
    const all=[...l.matchAll(/\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g)];
    if(all.length){
      hasTime=1;
      const text=l.replace(/\[\d{1,2}:\d{2}(?:\.\d{1,3})?\]/g,'').trim();
      for(const m of all){
        const t=+m[1]*60+ +m[2]+(m[3]?+('0.'+m[3]):0);
        timed.push({t,x:text});
      }
    }else if(l.length){
      timed.push({t:-1,x:l});
    }
  }
  if(hasTime){
    const only=timed.filter(l=>l.t>=0).sort((a,b)=>a.t-b.t);
    return {LS:1,LY:only};
  }
  const plain=timed.map(l=>l.x).filter(Boolean);
  if(!plain.length)return {LS:0,LY:[]};
  const dur=duration||au.duration||0;
  const intro=dur?Math.min(24,Math.max(8,dur*0.1)):10;
  const outro=dur?Math.min(20,Math.max(6,dur*0.08)):8;
  const start=intro;
  const end=dur>start+outro?dur-outro:Math.max(start+plain.length*2,start+30);
  const span=Math.max(1,end-start);
  const LY=plain.map((x,i)=>{
    const p=plain.length===1?0:i/(plain.length-1);
    const eased=p*p*(3-2*p);
    return {t:start+eased*span,x};
  });
  return {LS:0,LY};
}
function lyBuild(s){

  }

}

}
async function fetchLyrics(){
  if(!cur)return toast('Play a song first');
  const artist=(cur.artist||'').replace(/^Unknown artist$/i,'').trim();
  const title=(cur.title||'').trim();
  if(!title)return toast('Need a song title');
  toast('Fetching lyrics…');
  try{
    const dur=Math.round(au.duration||0);
    const q=new URLSearchParams({track_name:title,artist_name:artist||' ',album_name:cur.album||''});
    if(dur>0)q.set('duration',String(dur));
    let r=await fetch('https://lrclib.net/api/get?'+q);
    let data=null;
    if(r.ok)data=await r.json();
    if(!data||(!data.syncedLyrics&&!data.plainLyrics)){
      const sq=new URLSearchParams({q:(artist?artist+' ':'')+title});
      r=await fetch('https://lrclib.net/api/search?'+sq);
      if(r.ok){
        const arr=await r.json();
        const best=(arr||[]).find(x=>x.syncedLyrics)||(arr||[])[0];
        if(best){
          if(best.id){
            const g=await fetch('https://lrclib.net/api/get/'+best.id);
            if(g.ok)data=await g.json();
            else data=best;
          }else data=best;
        }
      }
    }
    const text=(data&&(data.syncedLyrics||data.plainLyrics)||'').trim();
    if(!text)return toast('No lyrics found');
    cur.lyrics=text;cur.ed=1;
    await save('songs',cur);
    lyBuild(cur);
    toast(data.syncedLyrics?'Synced lyrics added':'Lyrics added (plain)');
  }catch(e){
    console.error(e);
    toast('Fetch failed — paste lyrics manually');
  }
}

/* Cover gestures: swipe skip, drag scrub, double-tap ±10s */
(function(){
  const el=$('#scr');if(!el)return;
  let x0=0,y0=0,t0=0,seeking=0,base=0,lastTap=0,lastTapX=0;
  const max=()=>au.duration||0;
  el.addEventListener('touchstart',e=>{
    if(!e.touches.length)return;
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();seeking=0;base=au.currentTime;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!e.touches.length)return;
    const t=e.touches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(!seeking&&Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.2){
      seeking=1;el.classList.add('scrubbing');
    }
    if(seeking&&max()){
      e.preventDefault();
      const delta=(dx/el.clientWidth)*Math.min(90,max());
      const nt=Math.max(0,Math.min(max(),base+delta));
      seek.value=nt;$('#t1').textContent=fmt(nt);
    }
  },{passive:false});
  el.addEventListener('touchend',e=>{
    el.classList.remove('scrubbing');
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0,dt=Date.now()-t0;
    if(seeking){
      if(max())au.currentTime=Math.max(0,Math.min(max(),base+(dx/el.clientWidth)*Math.min(90,max())));
      seeking=0;return;
    }
    if(dt<300&&Math.abs(dx)<12&&Math.abs(dy)<12){
      const now=Date.now();
      if(now-lastTap<320&&Math.abs(t.clientX-lastTapX)<40){
        const left=t.clientX<el.getBoundingClientRect().left+el.clientWidth/2;
        au.currentTime=Math.max(0,Math.min(max(),au.currentTime+(left?-10:10)));
        toast(left?'−10 seconds':'+10 seconds');
        lastTap=0;return;
      }
      lastTap=now;lastTapX=t.clientX;return;
    }
    if(dt<500&&Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0)step(1);else step(-1);
    }
  },{passive:true});
})();

(function(){
  const w=$('#wheel');if(!w)return;
  let lastAng=null;
  function ang(e,rect){const t=e.touches?e.touches[0]:e;const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;return Math.atan2(t.clientY-cy,t.clientX-cx)}
  w.addEventListener('touchstart',e=>{const r=w.getBoundingClientRect();lastAng=ang(e,r)},{passive:true});
  w.addEventListener('touchmove',e=>{
    if(lastAng==null||!au.duration)return;
    const r=w.getBoundingClientRect();const a=ang(e,r);let d=a-lastAng;
    if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;
    lastAng=a;
    const delta=d/(Math.PI*2)*Math.min(45,au.duration);
    au.currentTime=Math.max(0,Math.min(au.duration,au.currentTime+delta));
  },{passive:true});
  w.addEventListener('touchend',()=>{lastAng=null},{passive:true});
})();
